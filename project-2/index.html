
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>some things i've kept.</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="home-page">

    <!-- FLOATING CLOUDS -->

    <div class="home-cloud cloud-one">☁</div>
    <div class="home-cloud cloud-two">☁</div>
    <div class="home-cloud cloud-three">☁</div>
    <div class="home-cloud cloud-four">☁</div>
    <div class="home-cloud cloud-five">☁</div>
    <div class="home-cloud cloud-six">☁</div>
    <div class="home-cloud cloud-seven">☁</div>
    <div class="home-cloud cloud-eight">☁</div>


    <!-- MAIN HOMEPAGE -->

    <main class="home-content" id="homeContent">

        <p class="home-small">
            a little collection of my life
        </p>

        <h1>some things i've kept.</h1>

        <p class="home-intro">
            i guess i've kept more than i thought...
        </p>


        <!-- MEMORY BOX -->

        <div class="home-box" onclick="openHomeBox()">

            <img
                src="images/box.png"
                alt="My childhood memory box"
            >

        </div>

        <p class="home-click">
            click to open the box ↗
        </p>


        <!-- HANDWRITTEN NOTES -->

        <span class="home-note note-one">
            little pieces of me ♡
        </span>

        <span class="home-note note-two">
            memories worth keeping...
        </span>

    </main>


    <!-- DREAMY WHITE FADE -->

    <div class="home-fade" id="homeFade"></div>


    <script>

        function openHomeBox() {

            const content = document.getElementById("homeContent");
            const fade = document.getElementById("homeFade");

            // Blur the homepage
            content.classList.add("home-opening");

            // Fade into white
            fade.classList.add("fade-active");

            // Open the memory desk
            setTimeout(function() {
                window.location.href = "box.html";
            }, 1200);

        }

    </script>

</body>
</html>
